name: Release

on:
#   workflow_run:
#     # workflows: ["Build"]
#     workflows: ["Test"]
#     types:
#       - completed
  pull_request:
    branches:
      - master

jobs:
  on-success:
    runs-on: ubuntu-latest
    steps:
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: target/thumbv7m-none-eabi/release/*.elf

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: target/thumbv7m-none-eabi/release/*.bin

      - name: Upload HEX
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: target/thumbv7m-none-eabi/release/*.hex
