name: Build

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        # run: cargo clippy --target thumbv7m-none-eabi -- -D warnings
        run: cargo clippy --target thumbv7m-none-eabi

      - name: Build
        run: cargo build --release --target thumbv7m-none-eabi
      
      - name: Firmware size
        run: | 
            rustup component add llvm-tools
            cargo install cargo-binutils
            cargo size --release --target thumbv7m-none-eabi --bin sensory_fusion